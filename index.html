<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Image Gallery</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="gallery-header">

        <h1>Image Gallery</h1>

        <p>
            Explore our collection of cars, bikes and taxis
        </p>

    </header>


    <!-- ================= FILTER BUTTONS ================= -->

    <div class="filter-buttons">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="car">
            Cars
        </button>

        <button class="filter-btn" data-filter="bike">
            Bikes
        </button>

        <button class="filter-btn" data-filter="taxi">
            Taxis
        </button>

    </div>


    <!-- ================= GALLERY ================= -->

    <div class="container gallery-container">

        <div class="row">


            <!-- IMAGE 1 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="car">

                <div class="gallery-card">

                    <img src="img/car-1.webp" alt="Car 1">

                    <div class="image-overlay">

                        <div>
                            <span>CAR</span>

                            <h3>Luxury Car</h3>
                        </div>

                        <button class="view-btn" data-image="img/car-1.webp" data-title="Luxury Car">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 2 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="car">

                <div class="gallery-card">

                    <img src="img/car-2.jpg" alt="Car 2">

                    <div class="image-overlay">

                        <div>
                            <span>CAR</span>

                            <h3>Sports Car</h3>
                        </div>

                        <button class="view-btn" data-image="img/car-2.jpg" data-title="Sports Car">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 3 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="car">

                <div class="gallery-card">

                    <img src="img/car-3.jpg" alt="Car 3">

                    <div class="image-overlay">

                        <div>
                            <span>CAR</span>

                            <h3>Modern Car</h3>
                        </div>

                        <button class="view-btn" data-image="img/car-3.jpg" data-title="Modern Car">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 4 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="bike">

                <div class="gallery-card">

                    <img src="img/bike-1.jpg" alt="Bike 1">

                    <div class="image-overlay">

                        <div>
                            <span>BIKE</span>

                            <h3>Sports Bike</h3>
                        </div>

                        <button class="view-btn" data-image="img/bike-1.jpg" data-title="Sports Bike">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 5 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="bike">

                <div class="gallery-card">

                    <img src="img/bike-2.jpg" alt="Bike 2">

                    <div class="image-overlay">

                        <div>
                            <span>BIKE</span>

                            <h3>Classic Bike</h3>
                        </div>

                        <button class="view-btn" data-image="img/bike-2.jpg" data-title="Classic Bike">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 6 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="bike">

                <div class="gallery-card">

                    <img src="img/bike-3.jpg" alt="Bike 3">

                    <div class="image-overlay">

                        <div>
                            <span>BIKE</span>

                            <h3>Modern Bike</h3>
                        </div>

                        <button class="view-btn" data-image="img/bike-3.jpg" data-title="Modern Bike">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 7 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="taxi">

                <div class="gallery-card">

                    <img src="img/taxi-1.jpg" alt="Taxi 1">

                    <div class="image-overlay">

                        <div>
                            <span>TAXI</span>

                            <h3>City Taxi</h3>
                        </div>

                        <button class="view-btn" data-image="img/taxi-1.jpg" data-title="City Taxi">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 8 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="taxi">

                <div class="gallery-card">

                    <img src="img/taxi-2.jpg" alt="Taxi 2">

                    <div class="image-overlay">

                        <div>
                            <span>TAXI</span>

                            <h3>Premium Taxi</h3>
                        </div>

                        <button class="view-btn" data-image="img/taxi-2.jpg" data-title="Premium Taxi">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>


            <!-- IMAGE 9 -->

            <div class="col-12 col-sm-6 col-lg-4 gallery-item" data-category="taxi">

                <div class="gallery-card">

                    <img src="img/taxi-3.jpg" alt="Taxi 3">

                    <div class="image-overlay">

                        <div>
                            <span>TAXI</span>

                            <h3>Classic Taxi</h3>
                        </div>

                        <button class="view-btn" data-image="img/taxi-3.jpg" data-title="Classic Taxi">

                            <i class="fa-solid fa-eye"></i>
                            View

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <button class="close-btn" id="closeBtn">
            <i class="fa-solid fa-xmark"></i>
        </button>


        <button class="prev-btn" id="prevBtn">
            <i class="fa-solid fa-chevron-left"></i>
        </button>


        <div class="lightbox-content">

            <img id="lightboxImage" src="" alt="">

            <h3 id="lightboxTitle"></h3>

        </div>


        <button class="next-btn" id="nextBtn">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </div>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
